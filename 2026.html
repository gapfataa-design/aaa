<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Te quiero Sara</title>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at 50% 20%, #0b132b 0%, #03050c 55%, #000000 100%);
      color: #f0f6ff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px 36px;
      cursor: pointer;
      user-select: none;
    }

    .scene {
      width: min(540px, 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .title {
      font-family: 'Pacifico', cursive;
      font-size: clamp(1.9rem, 5.8vw, 2.65rem);
      font-weight: 400;
      color: #fff1f2;
      text-shadow:
        0 0 7px rgba(255, 255, 255, 0.9),
        0 0 16px rgba(239, 68, 68, 0.9),
        0 0 32px rgba(37, 99, 235, 0.8),
        0 0 48px rgba(220, 38, 38, 0.6);
      margin-bottom: -10px;
      z-index: 2;
      text-align: center;
    }

    .canvas-wrap {
      position: relative;
      width: 100%;
      max-width: 430px;
      aspect-ratio: 1 / 0.92;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .floor-glow {
      position: absolute;
      bottom: 10%;
      width: 62%;
      height: 18px;
      border-radius: 50%;
      background: radial-gradient(
        ellipse at center,
        rgba(248, 113, 113, 0.75) 0%,
        rgba(59, 130, 246, 0.55) 45%,
        transparent 75%
      );
      filter: blur(7px);
      pointer-events: none;
      transition: transform 0.6s ease, opacity 0.6s ease;
    }

    body.started .floor-glow {
      transform: scaleX(1.15);
      opacity: 1;
    }

    .hint-pill {
      margin-top: 2px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 5px 13px;
      border-radius: 999px;
      border: 1px solid rgba(248, 113, 113, 0.35);
      background: linear-gradient(90deg, rgba(127, 29, 29, 0.38), rgba(30, 58, 138, 0.38));
      color: #ffe4e6;
      font-size: 0.76rem;
      letter-spacing: 0.3px;
      box-shadow: 0 0 16px rgba(37, 99, 235, 0.2);
      transition: opacity 0.4s ease, border-color 0.25s ease;
    }

    .eq-bars {
      display: inline-flex;
      align-items: flex-end;
      gap: 2px;
      height: 10px;
    }

    .eq-bars span {
      width: 2px;
      height: 4px;
      border-radius: 2px;
      background: #fda4af;
    }

    body.started .eq-bars span {
      animation: eqBounce 0.75s ease-in-out infinite alternate;
    }

    body.started .eq-bars span:nth-child(2) {
      animation-delay: 0.2s;
      background: #93c5fd;
    }

    body.started .eq-bars span:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes eqBounce {
      0% { height: 3px; }
      100% { height: 10px; }
    }
  </style>
</head>
<body>
  <main class="scene">
    <h1 class="title">Te quiero</h1>

    <div class="canvas-wrap">
      <canvas id="heartCanvas" width="800" height="720"></canvas>
      <div class="floor-glow"></div>
    </div>

    <div id="hintPill" class="hint-pill">
      <span class="eq-bars" aria-hidden="true">
        <span></span><span></span><span></span>
      </span>
      <span id="hintText">♪ Haz clic para empezar</span>
    </div>
  </main>

  <audio id="bgMusic" loop playsinline preload="auto">
    <source src="./Sunflower - Post Malone, Swae Lee ( Marvel Spider-Man 2 ) Web Swinging with Miles Morales.mp3" type="audio/mpeg" />
    <source src="./aaa.mp3" type="audio/mpeg" />
    <source src="./aaa" type="audio/mpeg" />
  </audio>

  <script>
    const bgMusic = document.getElementById('bgMusic');
    const hintText = document.getElementById('hintText');
    bgMusic.volume = 1.0;

    var Point = (function () {
      function Point(x, y) {
        this.x = (typeof x !== 'undefined') ? x : 0;
        this.y = (typeof y !== 'undefined') ? y : 0;
      }
      Point.prototype.clone = function () {
        return new Point(this.x, this.y);
      };
      return Point;
    })();

    const canvas = document.getElementById('heartCanvas');
    const ctx = canvas.getContext('2d');

    const COUNT = 2600;
    const particles = [];
    const dustBed = [];

    let hasStarted = false;
    let buildProgress = 0;
    let t = 0;
    let pulseWave = 0;

    function heartFormula(angle, scale) {
      const x = 16 * Math.pow(Math.sin(angle), 3);
      const y = -(
        13 * Math.cos(angle) -
        5 * Math.cos(2 * angle) -
        2 * Math.cos(3 * angle) -
        Math.cos(4 * angle)
      );
      return new Point(x * scale, y * scale);
    }

    for (let i = 0; i < COUNT; i++) {
      const angle = Math.random() * Math.PI * 2;
      const onRim = i % 3 === 0;
      const r = onRim
        ? 0.91 + Math.random() * 0.09
        : 0.12 + Math.pow(Math.random(), 0.48) * 0.82;

      const target = heartFormula(angle, r);
      const paletteRoll = i % 7;

      // Paleta Spider-Man: rojo carmesí, azul cobalto/eléctrico y destellos blancos
      let colorRGB;
      if (paletteRoll === 0) {
        colorRGB = '255, 255, 255';
      } else if (target.x < 0 ? paletteRoll % 2 === 1 : paletteRoll % 2 === 0) {
        colorRGB = '239, 68, 68'; // Rojo Spider-Man
      } else {
        colorRGB = '59, 130, 246'; // Azul Spider-Man
      }

      particles.push({
        target,
        colorRGB,
        pos: new Point(
          (Math.random() - 0.5) * 440,
          205 + (Math.random() - 0.5) * 32
        ),
        vel: new Point(0, 0),
        size: onRim ? 1.2 + Math.random() * 1.5 : 0.8 + Math.random() * 1.2,
        alpha: 0.42 + Math.random() * 0.58,
        phase: Math.random() * Math.PI * 2
      });
    }

    for (let i = 0; i < 320; i++) {
      const a = Math.random() * Math.PI * 2;
      const rad = Math.sqrt(Math.random());
      const dustColor = i % 2 === 0 ? '248, 113, 113' : '96, 165, 250';
      dustBed.push({
        ox: Math.cos(a) * rad * 215,
        oy: Math.sin(a) * rad * 16,
        size: 0.8 + Math.random() * 1.4,
        phase: Math.random() * Math.PI * 2,
        speed: 0.6 + Math.random() * 1.2,
        dustColor
      });
    }

    function triggerExperience() {
      if (!hasStarted) {
        hasStarted = true;
        document.body.classList.add('started');
        hintText.textContent = '♪ Sunflower';
        bgMusic.muted = false;
        bgMusic.play().catch(() => {});
      }
      pulseWave = 1;
    }

    document.body.addEventListener('click', triggerExperience);

    function animate() {
      requestAnimationFrame(animate);
      t += 0.02;
      pulseWave = Math.max(0, pulseWave - 0.016);

      if (hasStarted && buildProgress < 1) {
        buildProgress = Math.min(1, buildProgress + 0.014);
      }

      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const cx = canvas.width * 0.5;
      const cy = canvas.height * 0.45;
      const floorY = canvas.height * 0.82;

      const auraRadius = 110 + buildProgress * 145;
      const aura = ctx.createRadialGradient(cx, cy, 10, cx, cy, auraRadius);
      aura.addColorStop(0, `rgba(239, 68, 68, ${(0.08 + buildProgress * 0.14).toFixed(3)})`);
      aura.addColorStop(0.5, `rgba(37, 99, 235, ${(0.06 + buildProgress * 0.11).toFixed(3)})`);
      aura.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = aura;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < dustBed.length; i++) {
        const d = dustBed[i];
        const bx = cx + d.ox + Math.sin(t * d.speed + d.phase) * 6;
        const by = floorY + d.oy + Math.cos(t * d.speed + d.phase) * 2.5;
        const bAlpha = 0.25 + 0.5 * Math.sin(t * 2.8 + d.phase);
        ctx.beginPath();
        ctx.arc(bx, by, d.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${d.dustColor}, ${Math.max(0.08, bAlpha).toFixed(3)})`;
        ctx.fill();
      }

      const ease = 1 - Math.pow(1 - buildProgress, 3);
      const growth = 0.22 + 0.78 * ease;
      const beat = hasStarted
        ? (1 + 0.05 * Math.sin(t * 3.1) + 0.18 * pulseWave)
        : 1;
      const heartScale = 15.6 * growth * beat;

      for (let i = 0; i < COUNT; i++) {
        const p = particles[i];

        const goalX = p.target.x * heartScale;
        const goalY = p.target.y * heartScale;

        const startX = p.target.x * 4.5 + Math.sin(p.phase + t) * 14;
        const startY = 205 + Math.cos(p.phase + t) * 9;

        const tx = startX + (goalX - startX) * ease;
        const ty = startY + (goalY - startY) * ease;

        p.vel.x = (p.vel.x + (tx - p.pos.x) * 0.055) * 0.82;
        p.vel.y = (p.vel.y + (ty - p.pos.y) * 0.055) * 0.82;

        p.pos.x += p.vel.x;
        p.pos.y += p.vel.y;

        const twinkle = 0.58 + 0.42 * Math.sin(t * 4.5 + p.phase);
        const alpha = Math.min(1, p.alpha * twinkle * (0.28 + 0.72 * ease));

        ctx.beginPath();
        ctx.arc(cx + p.pos.x, cy + p.pos.y, p.size * (0.85 + 0.25 * ease), 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${p.colorRGB}, ${alpha.toFixed(3)})`;
        ctx.fill();
      }
    }

    animate();
  </script>
</body>
</html>
